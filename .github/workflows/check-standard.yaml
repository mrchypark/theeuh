# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # GitHub manages runner clocks; avoid unreliable external time APIs.
      _R_CHECK_SYSTEM_CLOCK_: 'false'
      # Prevent ONNX Runtime telemetry from leaving temporary trace files.
      ORT_DISABLE_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::churon, any::rcmdcheck, any::covr, any::testthat
          dependencies: '"hard"'

      - name: Install ONNX Runtime
        if: runner.os != 'Windows'
        run: |
          runtime_dir <- file.path(Sys.getenv("RUNNER_TEMP"), "onnxruntime")
          churon::install_onnx_runtime(destdir = runtime_dir)
          stopifnot(churon::check_onnx_runtime_available())
          cat(
            "ORT_DYLIB_PATH=", Sys.getenv("ORT_DYLIB_PATH"), "\n",
            file = Sys.getenv("GITHUB_ENV"), sep = ""
          )
        shell: Rscript {0}

      # churon 0.1.13 passes unsupported quiet=TRUE to unzip() on Windows.
      - name: Install ONNX Runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'onnxruntime'
          $archive = Join-Path $env:RUNNER_TEMP 'onnxruntime.zip'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'c9b4b7086b529ad814f428c1bad028e20a25d7dc0699836775faace4ab5b78b2') { throw 'ONNX Runtime checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeDir
          Remove-Item $archive
          $env:ORT_DYLIB_PATH = Join-Path $runtimeDir 'onnxruntime-win-x64-1.29.0/lib/onnxruntime.dll'
          "ORT_DYLIB_PATH=$env:ORT_DYLIB_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          Rscript -e 'stopifnot(churon::check_onnx_runtime_available())'

      - uses: r-lib/actions/check-r-package@v2

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
