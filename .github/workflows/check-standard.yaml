# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # GitHub manages runner clocks; avoid unreliable external time APIs.
      _R_CHECK_SYSTEM_CLOCK_: 'false'
      # Prevent ONNX Runtime telemetry from leaving temporary trace files.
      ORT_DISABLE_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::churon, any::rcmdcheck, any::covr, any::testthat
          dependencies: '"hard"'

      - name: Install ONNX Runtime
        run: |
          runtime_dir <- file.path(Sys.getenv("RUNNER_TEMP"), "onnxruntime")
          churon::install_onnx_runtime(destdir = runtime_dir)
          stopifnot(churon::check_onnx_runtime_available())
          cat(
            "ORT_DYLIB_PATH=", Sys.getenv("ORT_DYLIB_PATH"), "\n",
            file = Sys.getenv("GITHUB_ENV"), sep = ""
          )
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2

      - name: Test coverage
        run: covr::codecov()
        shell: Rscript {0}
